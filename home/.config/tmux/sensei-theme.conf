# Sensei: black surfaces, Kitty pink/red, blue detail, Nerd Font glyphs.
set -g status-style 'bg=#000000,fg=#8bb9f6'
set -g status-position bottom
set -g status-justify centre
set -g status-interval 10
set -g status-left-length 75
set -g status-right-length 100
set -g status-left '#[bg=#000000]#[fg=#D8054A]#[bg=#D8054A]#[fg=#000000]#[bold] 󰚩 Sensei #[bg=#000000]#[fg=#D8054A]#[nobold] #(@HOME@/.local/bin/sensei-tmux-status sessions #{q:session_id} #{client_width})#{?client_prefix,#[bg=#000000]#[fg=#D8054A]#[bg=#D8054A]#[fg=#000000]#[bold] 󰌌 PREFIX #[bg=#000000]#[fg=#D8054A]#[nobold] ,}#{?pane_in_mode,#[bg=#000000]#[fg=#D8054A]#[bg=#D8054A]#[fg=#000000] 󰆏 COPY #[bg=#000000]#[fg=#D8054A]#[nobold] ,}#{?window_zoomed_flag,#[bg=#000000]#[fg=#D8054A]#[bg=#D8054A]#[fg=#000000] 󰊓 ZOOM #[bg=#000000]#[fg=#D8054A]#[nobold] ,}'
set -g status-right '#[bg=#000000]#[fg=#D8054A]#[bg=#D8054A]#[fg=#000000]#[bold] 󰒋 #{=30:session_name} #[bg=#000000]#[fg=#D8054A]#[nobold]'
setw -g window-status-separator ''
setw -g window-status-format '#[bg=#000000]#[fg=#26282d]#[bg=#26282d]#[fg=#8a8a8a]  #I · #{=14:window_name} #{?window_bell_flag,#[fg=#000000]󰂞 ,}#{?window_activity_flag,#[fg=#000000]● ,}#[bg=#000000]#[fg=#26282d]#[nobold] '
setw -g window-status-current-format '#[bg=#000000]#[fg=#D8054A]#[bg=#D8054A]#[fg=#000000]#[bold]  #I · #{=14:window_name} #{?window_zoomed_flag,󰊓 ,}#[bg=#000000]#[fg=#D8054A]#[nobold] '
setw -g window-status-activity-style 'fg=#ff1767,bg=#000000'
setw -g window-status-bell-style 'fg=#ff1767,bg=#000000,bold'
set -g message-style 'fg=#8bb9f6,bg=#080a0e'
set -g message-command-style 'fg=#D8054A,bg=#080a0e'
set -g pane-border-style 'fg=#26282d'
set -g pane-active-border-style 'fg=#D8054A'
setw -g mode-style 'bg=#D8054A,fg=#ffffff'
set -g display-panes-colour '#8bb9f6'
set -g display-panes-active-colour '#ff1767'
set -g clock-mode-colour '#D8054A'
