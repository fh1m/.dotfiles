<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noesis · focus instrument</title>
<style>
:root{color-scheme:dark;font:15px/1.5 'Iosevka Nerd Font','ZedMono Nerd Font',monospace;color:#eee6ec;background:#09090c}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:900px;margin:auto;border:1px solid #39232f;border-radius:14px;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:32px}small{color:#b6a8b2;letter-spacing:.12em}h1{margin:8px 0;font-weight:500;font-size:52px;line-height:1.1;font-variant-numeric:tabular-nums}p{margin:6px 0;color:#b6a8b2}button,select{font:inherit;color:inherit;background:#19141b;border:1px solid #49313e;padding:9px 16px;border-radius:8px;cursor:pointer}button:first-child{background:#e53980;border-color:#e53980;color:white}button:hover,select:hover{border-color:#ff8cba}button:focus-visible,select:focus-visible{outline:2px solid #ff8cba;outline-offset:3px}.controls{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}progress{width:100%;height:4px;accent-color:#ff4795}.right{min-width:220px;max-width:360px}@media(max-width:600px){main{align-items:stretch;flex-direction:column;gap:16px}h1{font-size:44px}.right{min-width:0}}
</style>
<main><section><small>NOESIS / FOCUS INSTRUMENT</small><h1 id="clock" aria-live="off">25:00</h1><p id="state">Choose one useful next action.</p><progress id="progress" value="0" max="1" aria-label="Elapsed portion"></progress></section><section class="right"><label for="duration">A working interval, not an obligation</label><br><select id="duration"><option value="25">25 minutes</option><option value="50">50 minutes</option><option value="90">90 minutes</option><option value="5">5-minute break</option></select><div class="controls"><button id="toggle">Start</button><button id="reset">Reset</button></div><p>Afterwards: record what you actually attempted. Time spent never awards mastery.</p></section></main>
<script>
const clock=document.getElementById('clock'),state=document.getElementById('state'),bar=document.getElementById('progress'),select=document.getElementById('duration'),toggle=document.getElementById('toggle');
let total=1500,remaining=1500,end=0,running=false;
function draw(){if(running){remaining=Math.max(0,(end-Date.now())/1000);if(!remaining){running=false;toggle.textContent='Start again';state.textContent='Interval complete. Pause, reflect, or continue by choice.';select.disabled=false;}}const s=Math.ceil(remaining);clock.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');bar.value=1-remaining/total;}
function reset(){running=false;total=Number(select.value)*60;remaining=total;toggle.textContent='Start';state.textContent='Choose one useful next action.';select.disabled=false;draw();}
toggle.onclick=()=>{if(running){remaining=Math.max(0,(end-Date.now())/1000);running=false;toggle.textContent='Resume';state.textContent='Paused. Your attention is yours.';}else{if(!remaining)remaining=total;end=Date.now()+remaining*1000;running=true;toggle.textContent='Pause';state.textContent='Work on the thing, not the dashboard.';}select.disabled=running;draw();};
document.getElementById('reset').onclick=reset;select.onchange=reset;document.addEventListener('visibilitychange',draw);setInterval(()=>{if(running&&!document.hidden)draw()},1000);
</script></html>
