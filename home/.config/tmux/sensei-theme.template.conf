# Sensei: one calm OLED rail. Wallpaper colour marks only active work.
set -g status-style 'bg=#000000,fg=@TEXT@'
set -g status-position bottom
set -g status-justify left
set -g status-interval 10
set -g status-left-length 56
set -g status-right-length 44
set -g status-left '#[bg=@ACCENT@,fg=#000000,bold] 󰚩 SENSEI #[bg=#17171a,fg=@TEXT@] 󰒋 #{=18:session_name} #[bg=#000000,fg=@OUTLINE@,nobold]│'
set -g status-right '#[bg=#17171a,fg=@TEXT@] 󰉋 #{=21:#{b:pane_current_path}} #[bg=#000000,fg=@OUTLINE@]│#{?client_prefix,#[fg=@ACCENT@]󰌌 Prefix,}#{?pane_in_mode,#[fg=@ACCENT@]󰆏 Copy,}#{?window_zoomed_flag,#[fg=@ACCENT@]󰊓 Zoom,}#[bg=@ACCENT@,fg=#000000,bold] 󰌌 ` '
setw -g window-status-separator '#[bg=#000000,fg=@OUTLINE@]│'
setw -g window-status-format '#[bg=#000000,fg=@MUTED@,nobold]  #I · #{=16:window_name} '
setw -g window-status-current-format '#[bg=@ACCENT@,fg=#000000,bold]  #I · #{=16:window_name} #[bg=#000000]'
setw -g window-status-activity-style 'fg=@ACCENT@,bg=#000000'
setw -g window-status-bell-style 'fg=@ACCENT@,bg=#000000,bold'
set -g message-style 'fg=@TEXT@,bg=#17171a'
set -g message-command-style 'fg=@ACCENT@,bg=#17171a'
set -g pane-border-style 'fg=@OUTLINE@'
set -g pane-active-border-style 'fg=@ACCENT@'
setw -g mode-style 'bg=@ACCENT@,fg=#000000'
set -g display-panes-colour '@MUTED@'
set -g display-panes-active-colour '@ACCENT@'
set -g clock-mode-colour '@ACCENT@'
