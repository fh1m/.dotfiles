# Sensei daily terminal: one persistent server, fast local rendering, no plugin hooks.
unbind C-b
set -g prefix '`'
set -g default-terminal 'tmux-256color'
set -s terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys,screen*:title,rxvt*:ignorefkeys,alacritty*:RGB:clipboard:extkeys,xterm-kitty:RGB:clipboard:extkeys'
set -s extended-keys on
set -g set-clipboard external
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g status on
set -g status-interval 10
set -g status-position bottom
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g display-time 800
set -g set-titles on
set -g set-titles-string '#{session_name} · #{window_name}'
set -g update-environment 'DISPLAY WAYLAND_DISPLAY SSH_ASKPASS SSH_AUTH_SOCK XAUTHORITY XDG_CURRENT_DESKTOP XDG_RUNTIME_DIR'
setw -g mode-keys vi
setw -g allow-rename off
set -g allow-passthrough on

bind-key '|' split-window -h -c '#{pane_current_path}'
bind-key '-' split-window -v -c '#{pane_current_path}'
bind-key Enter new-window -c '#{pane_current_path}'
bind-key "'" new-window -c '#{pane_current_path}'
bind-key c new-window -c '#{pane_current_path}'
bind-key BSpace confirm-before -p 'Kill pane? (y/n)' kill-pane
bind-key x confirm-before -p 'Close pane #{pane_index}? (y/n)' kill-pane
bind-key '&' confirm-before -p 'Close window #{window_index}:#{window_name}? (y/n)' kill-window
bind-key X confirm-before -p 'Kill session? (y/n)' kill-session
bind-key r source-file ~/.tmux.conf \; display-message 'Sensei tmux reloaded'
bind-key Space next-layout
bind-key z resize-pane -Z
bind-key S set-window-option synchronize-panes
bind-key g display-popup -E -w 60% -h 60% '@HOME@/.local/bin/sensei-project-picker'
bind-key '`' last-window
bind-key s choose-tree -s
bind-key w choose-tree -w
bind-key [ copy-mode -e
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down
# Explicit history navigation works even in Codex/Claude full-screen TUIs.
bind-key -n C-S-Up copy-mode -e \; send-keys -X scroll-up
bind-key -n C-S-Down if-shell -F '#{pane_in_mode}' 'send-keys -X scroll-down' 'send-keys C-S-Down'

# Focused plugin set: search, clipboard, session picker, recovery, one wheel handler.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @yank_with_mouse on
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'off'
run-shell '~/.tmux/plugins/tpm/tpm'

source-file ~/.config/tmux/sensei-theme.conf

# Pass the literal backtick prefix to an editor.
bind b send-prefix

# Application modifiers belong to applications. Tmux navigation uses its prefix.
unbind-key -n S-Left
unbind-key -n S-Right
unbind-key -n M-Left
unbind-key -n M-Right
unbind-key -n M-Up
unbind-key -n M-Down
bind-key Left previous-window
bind-key Right next-window
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key PageUp copy-mode -u
bind-key PageDown if-shell -F '#{pane_in_mode}' 'send-keys -X page-down' 'send-keys PageDown'
# Application-aware wheel routing: no subprocess or process-tree scan per tick.
bind-key -T root WheelUpPane if-shell -F -t = '#{pane_in_mode}' 'send-keys -X -N 3 -t = scroll-up' 'if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "copy-mode -e -t =; send-keys -X -N 3 -t = scroll-up"'
bind-key -T root WheelDownPane if-shell -F -t = '#{pane_in_mode}' 'send-keys -X -N 3 -t = scroll-down' 'if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" ""'
# Explicit history access remains available when an application captures the mouse.
bind-key -T root S-WheelUpPane copy-mode -e -t = \; send-keys -X -N 3 -t = scroll-up
bind-key -T copy-mode-vi Escape send-keys -X cancel
