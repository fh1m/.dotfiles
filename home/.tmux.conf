# Sensei daily terminal: one persistent server, fast local rendering, no plugin hooks.
unbind C-b
set -g prefix '`'
set -g default-terminal 'tmux-256color'
set -as terminal-features ',alacritty:RGB:clipboard,alacritty*:RGB:clipboard,xterm-kitty:RGB:clipboard'
set -g set-clipboard external
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g status on
set -g status-interval 10
set -g status-position bottom
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g display-time 800
set -g set-titles on
set -g set-titles-string '#{session_name} · #{window_name}'
set -g update-environment 'DISPLAY WAYLAND_DISPLAY SSH_ASKPASS SSH_AUTH_SOCK XAUTHORITY XDG_CURRENT_DESKTOP XDG_RUNTIME_DIR'
setw -g mode-keys vi
setw -g allow-rename off
set -g allow-passthrough on

bind-key '|' split-window -h -c '#{pane_current_path}'
bind-key '-' split-window -v -c '#{pane_current_path}'
bind-key Enter new-window -c '#{pane_current_path}'
bind-key "'" new-window -c '#{pane_current_path}'
bind-key c new-window -c '#{pane_current_path}'
bind-key BSpace confirm-before -p 'Kill pane? (y/n)' kill-pane
bind-key x confirm-before -p 'Close pane #{pane_index}? (y/n)' kill-pane
bind-key '&' confirm-before -p 'Close window #{window_index}:#{window_name}? (y/n)' kill-window
bind-key X confirm-before -p 'Kill session? (y/n)' kill-session
bind-key r source-file ~/.tmux.conf \; display-message 'Sensei tmux reloaded'
bind-key Space next-layout
bind-key z resize-pane -Z
bind-key S set-window-option synchronize-panes
bind-key g display-popup -E -w 60% -h 60% '/home/fh1m/.local/bin/sensei-project-picker'
bind-key '`' last-window
bind-key s choose-tree -s
bind-key w choose-tree -w
bind-key [ copy-mode -e
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down
bind-key -n S-Left previous-window
bind-key -n S-Right next-window
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D
# Explicit history navigation works even in Codex/Claude full-screen TUIs.
bind-key -n C-S-Up copy-mode -e \; send-keys -X scroll-up
bind-key -n C-S-Down if-shell -F '#{pane_in_mode}' 'send-keys -X scroll-down' 'send-keys C-S-Down'

# Focused plugin set: search, clipboard, session picker, recovery, one wheel handler.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @mighty-scroll-fallback-mode 'history'
set -g @mighty-scroll-pass-through 'vim nvim'
set -g @mighty-scroll-by-line 'man less fzf'
set -g @mighty-scroll-interval 3
set -g @mighty-scroll-select-pane off
set -g @yank_with_mouse on
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'off'
run-shell '~/.tmux/plugins/tpm/tpm'

source-file ~/.config/tmux/sensei-theme.conf

# Agent/editor modified arrows are preserved; explicit terminal window navigation.
unbind-key -n S-Left
unbind-key -n S-Right
unbind-key -n S-Up
unbind-key -n S-Down
bind-key -n M-S-Left previous-window
bind-key -n M-S-Right next-window
set -g history-limit 200000
set -g set-titles-string "#{session_name} · #{window_name}#{?#{==:pane_current_command,nvim}, · Neovim,}"
