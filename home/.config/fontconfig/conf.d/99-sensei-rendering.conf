<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
 <match target="font"><edit name="antialias" mode="assign"><bool>true</bool></edit><edit name="hinting" mode="assign"><bool>true</bool></edit><edit name="hintstyle" mode="assign"><const>hintslight</const></edit><edit name="rgba" mode="assign"><const>none</const></edit><edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit><edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit></match>
 <alias><family>Iosevka</family><prefer><family>Iosevka Nerd Font Mono</family></prefer></alias>
 <alias><family>Iosevka NFM</family><prefer><family>Iosevka Nerd Font Mono</family></prefer></alias>
 <alias><family>Zed Mono</family><prefer><family>ZedMono Nerd Font</family></prefer></alias>
</fontconfig>
