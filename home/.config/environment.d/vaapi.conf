# Force Intel iGPU as default VA-API device for video decode (browsers, media
# players). Without this, libva's node-order auto-probe picks the NVIDIA dGPU
# (renderD128) over the more power-efficient Intel iGPU (renderD129) for any
# app that doesn't explicitly request a GPU. CUDA/PyTorch/ML work is unaffected
# (separate API, not VA-API). Verified via ffmpeg vaapi decode test 2026-08-26.
LIBVA_DRIVER_NAME=iHD
