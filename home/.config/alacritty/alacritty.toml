# Sensei · fast daily terminal. The deck uses Alacritty too.
# Match the live Alacritty palette, Iosevka metrics and opaque compositor profile.
[general]
live_config_reload = true

[env]
TERM = "alacritty"

[window]
decorations = "None"
opacity = 1.0
padding = { x = 14, y = 8 }
dynamic_padding = true
resize_increments = true
title = "Sensei · Terminal"
dynamic_title = true

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "Iosevka Nerd Font Mono", style = "Medium" }
bold = { family = "Iosevka Nerd Font Mono", style = "Bold" }
italic = { family = "Iosevka Nerd Font Mono", style = "Italic" }
bold_italic = { family = "Iosevka Nerd Font Mono", style = "Bold Italic" }
size = 11.4
offset = { x = 1, y = 4 }
# Center ink in the extra letter/line spacing at integer pixel positions.
glyph_offset = { x = 1, y = 2 }
builtin_box_drawing = true

[colors.primary]
background = "#090807"
foreground = "#e8e2da"
dim_foreground = "#a9a29a"

[colors.cursor]
text = "#000000"
cursor = "#ffffff"

[colors.selection]
text = "#000000"
background = "#f23d70"

[colors.normal]
black = "#171311"
red = "#ff567a"
green = "#9dbf9e"
yellow = "#d6b59a"
blue = "#a6b9d1"
magenta = "#f23d70"
cyan = "#76bcc0"
white = "#e8e2da"

[colors.bright]
black = "#706963"
red = "#ff8099"
green = "#b5d3b1"
yellow = "#e8caa9"
blue = "#c1d0e4"
magenta = "#ff80a3"
cyan = "#9bd4d6"
white = "#fff3ea"

[cursor]
style = { shape = "Underline", blinking = "Never" }
unfocused_hollow = true

[selection]
save_to_clipboard = true

[terminal]
osc52 = "CopyPaste"

[mouse]
hide_when_typing = false

[[keyboard.bindings]]
key = "V"
mods = "Alt"
action = "Paste"

[[keyboard.bindings]]
key = "Return"
mods = "Control|Shift"
chars = "\u0060c"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
command = { program = "@HOME@/.local/bin/sensei-terminal" }

[[keyboard.bindings]]
key = "ArrowUp"
mods = "Control|Shift"
chars = "\u0060["

[[keyboard.bindings]]
key = "ArrowDown"
mods = "Control|Shift"
chars = "\u0060\u001b[6~"

[[keyboard.bindings]]
key = "H"
mods = "Control|Shift"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "/"
mods = "Control|Shift"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "F5"
mods = "Super"
action = "None"

[[keyboard.bindings]]
key = "Y"
mods = "Control|Shift"
command = { program = "@HOME@/.local/bin/sensei-terminal", args = ["--title", "Sensei · btop", "-e", "btop"] }

[[keyboard.bindings]]
key = "G"
mods = "Control|Shift"
command = { program = "@HOME@/.local/bin/sensei-terminal", args = ["--title", "Sensei · nvtop", "-e", "nvtop"] }

# Tab and layout keys routed into the persistent tmux session.
[[keyboard.bindings]]
key = "'"
mods = "Super"
chars = "\u0060c"

[[keyboard.bindings]]
key = "["
mods = "Super"
chars = "\u0060p"

[[keyboard.bindings]]
key = "]"
mods = "Super"
chars = "\u0060n"

[[keyboard.bindings]]
key = "L"
mods = "Control|Shift"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "M"
mods = "Control|Shift"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "E"
mods = "Control|Shift"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "Escape"
mods = "Control|Shift"
action = "ReceiveChar"

# Tmux owns history inside the daily terminal; avoid the outer empty scrollback.
[[keyboard.bindings]]
key = "PageUp"
mods = "Shift"
chars = "\u0060\u001b[5~"

[[keyboard.bindings]]
key = "PageDown"
mods = "Shift"
chars = "\u0060\u001b[6~"

# Deliberate window navigation, leaving Shift-arrows to editors and agents.
[[keyboard.bindings]]
key = "ArrowLeft"
mods = "Control|Alt"
chars = "\u0060p"

[[keyboard.bindings]]
key = "ArrowRight"
mods = "Control|Alt"
chars = "\u0060n"

# Native scrollback exploration and keyboard URL hints.
[[keyboard.bindings]]
key = "Space"
mods = "Control|Shift"
action = "ToggleViMode"
