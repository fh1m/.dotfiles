# Fonts
font_family                                  FantasqueSansM Nerd Font Mono
italic_font                                  auto
bold_font                                    auto
bold_italic_font                             auto
font_size                                    11.5
adjust_line_height                           1
box_drawing_scale                            0.001, 1, 1.5, 2
disable_ligatures                            never
modify_font                                  cell_width  120%
modify_font                                  cell_height 130%
modify_font                                  baseline 0
underline_exclusion                          1
text_composition_strategy                    platform

# Cursor
cursor_shape                                 underline
cursor_shape_unfocused                       hollow
cursor_blink_interval                        -1
cursor_stop_blinking_after                   0
pointer_shape_when_grabbed                   arrow
cursor_trail                                 0
cursor_trail_decay                           0.1 0.4
cursor_trail_start_threshold                 2
default_pointer_shape                        beam
pointer_shape_when_dragging                  arrow

# Scrollback
scrollback_lines                             10000
scrollbar                                    scrolled
scrollbar_interactive                        yes
scrollbar_jump_on_click                      yes
scrollbar_hover_width                        1
scrollbar_handle_opacity                     0.5
scrollbar_radius                             0.3
scrollbar_gap                                0.1
scrollbar_min_handle_height                  1
scrollbar_hitbox_expansion                   0.25
scrollbar_track_opacity                      0
scrollbar_track_hover_opacity                0.1
scrollbar_handle_color                       foreground
scrollbar_track_color                        foreground
scrollback_pager_history_size                10000
wheel_scroll_multiplier                      10.0
touch_scroll_multiplier                      10.0
scrollback_pager                             nvim --noplugin --clean -c "silent write! /tmp/kitty_scrollback_buffer | te cat /tmp/kitty_scrollback_buffer - "
scrollback_fill_enlarged_window              yes

# URLs
url_style                                   dashed
open_url_with                               default
detect_urls                                 yes
underline_hyperlinks                        always

# Selection
select_by_word_characters                   :@-./_~?&=%+#

# Mouse
click_interval                              0
mouse_hide_wait                             0
focus_follows_mouse                         no

# Performance
repaint_delay                               10
input_delay                                 0
sync_to_monitor                             yes

# Bell
visual_bell_duration                        0.2
enable_audio_bell                           yes

# Window
window_title_bar                            top
window_title_bar_min_windows                4
window_title_template                       "{fmt.fg.red} {bell_symbol}{activity_symbol}{fmt.fg.window}{progress_percent}  - {title} - "
active_window_title_template                "{fmt.fg.red} {bell_symbol}{activity_symbol}{fmt.fg.window}{progress_percent}  | {fmt.bold}{title} |  "
window_title_bar_align                      center
draw_window_borders_for_single_window       no
window_border_width                         0.8pt
draw_minimal_borders                        no
single_window_margin_width                  -1
placement_strategy                          center
resize_debounce_time                        0.1
remember_window_size                        no
initial_window_width                        1590
initial_window_height                       785
hide_window_decorations                     yes
window_margin_width                         2 6 2 6
single_window_margin_width                  -1
window_padding_width                         6
single_window_padding_width                 -1
inactive_text_alpha                         0.70
window_logo_path                            /home/fh1m/Downloads/seisei2.png
window_logo_position                        bottom-right
window_logo_scale                           6
window_logo_alpha                           0.5
wayland_titlebar_color                      system

# Background
background_opacity                          0.87
background_blur                             10
dynamic_background_opacity                  yes
dim_opacity                                 0.3

# Layouts
enabled_layouts                             *

# Tabs
tab_bar_edge                                top
active_tab_font_style                       bold
inactive_tab_font_style                     bold
tab_bar_style                               fade
tab_powerline_style                         slanted
# tab_title_template                        "[ 󰣇 {tab.active_exe} ] {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title} 󱒋 "
tab_title_template                          "{title}{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent} - {tab.active_exe} "
active_tab_title_template                   " {title}{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent} - {tab.active_exe} "
# active_tab_title_template                 "[ 󰣇 {tab.active_exe} ] {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title} 󱒋 "
active_tab_font_style                       bold
tab_bar_align                               center
shell_integration                           enabled
tab_switch_strategy                         left
tab_fade                                    0.25 0.35 0.55 1
tab_bar_min_tabs                            1
tab_bar_margin_width                        2.0
tab_bar_margin_height                       5 5

# Shell
shell .
close_on_child_death                        yes
allow_remote_control                        yes
term                                        xterm-kitty

# misc
strip_trailing_spaces                       always
copy_on_select                              yes
confirm_os_window_close                     0
clear_selection_on_clipboard_loss           no
clipboard_max_size                          512
allow_hyperlinks                            yes
paste_actions                               no-op
notify_on_cmd_finish                        unfocused 
linux_display_server                        auto
wayland_enable_ime                          yes
allow_cloning                               ask
clone_source_strategies                     venv,conda,env_var,path
map_timeout                                 0.0

# Alias (Action Alias)
action_alias launch_tab launch --type=tab --cwd=current
action_alias hints kitten hints --hints-offset=0
map f5 launch_tab nvim

# Keys
kitty_mod                 super
map alt+v                 paste_from_clipboard
map ctrl+shift+up         scroll_line_up
map ctrl+shift+down       scroll_line_down
map ctrl+shift+h          show_scrollback
mouse_map middle          release ungrabbed paste_from_clipboard
map ctrl+shift+enter      new_window
map ctrl+shift+n          new_os_window
map kitty_mod+]           next_window
map kitty_mod+[           previous_window
map kitty_mod+'           new_tab
map ctrl+shift+l          next_layout
map ctrl+shift+.          move_tab_forward
map ctrl+shift+,          move_tab_backward
map kitty_mod+f5          load_config_file
map ctrl+shift+x          scroll_to_prompt 1
map ctrl+shift+h          show_scrollback
map ctrl+shift+g          show_last_command_output
map f1                    show_last_visited_command_output 
map ctrl+shift+/          search_scrollback
map cmd+f                 search_scrollback
map ctrl+left             neighboring_window left
map ctrl+right            neighboring_window right
map ctrl+down             neighboring_window bottom
map ctrl+up               neighboring_window up
map ctrl+alt+left         move_window right
map ctrl+alt+left         move_window left
map ctrl+alt+right        move_window right
map ctrl+alt+up           move_window up
map ctrl+alt+down         move_window down
map ctrl+`                nth_window -1
map ctrl+shift+d          detach_window
map ctrl+f2               detach_window ask
map ctrl+f4               detach_tab ask
map f1                    copy_to_buffer a
map f2                    paste_from_buffer a

# Window Keybinds
# map kitty_mod+y launch mutt - launch programs
map kitty_mod+enter          new_window
map kitty_mod+y              launch btop
map ctrl+n                   launch --location=neighbor nvtop
map ctrl+t                   new_tab !neighbor btop
map shift+alt+t              set_tab_title
map ctrl+shift+m             toggle_layout stack
map ctrl+shift+escape        kitty_shell window
map ctrl+shift+e             launch --type=overlay --allow-remote-control @HOME@/.scripts/kitty-tab-switcher/kitty-tab-switcher

# Mouse
mouse_map                    middle release ungrabbed paste_from_selection
mouse_map                    left press ungrabbed mouse_selection normal
mouse_map                    ctrl+alt+left press ungrabbed mouse_selection rectangle
mouse_map                    left doublepress ungrabbed mouse_selection word
mouse_map                    left triplepress ungrabbed mouse_selection line
mouse_map                    ctrl+alt+left triplepress ungrabbed mouse_selection line_from_point
mouse_map                    right press ungrabbed mouse_selection extend
mouse_map                    shift+left press ungrabbed mouse_selection extend
mouse_map                    shift+left press grabbed mouse_selection normal

