# Signal Ledger / concise session instrument rail.
set -g status-style 'bg=#090807,fg=#e8e2da'
set -g status-position bottom
set -g status-justify left
set -g status-interval 10
set -g status-left-length 58
set -g status-right-length 110
set -g status-left '#[bg=#1e1b18,fg=#f23d70,bold] Session #[bg=#f23d70,fg=#090807,bold] #{=20:session_name} #[bg=#090807]   '
set -g status-right '#{?pane_in_mode,#[bg=#1e1b18,fg=#f23d70] Copy #[bg=#f23d70,fg=#090807,bold] mode #[bg=#090807]  ,}#{?window_zoomed_flag,#[bg=#1e1b18,fg=#f23d70] Zoom #[bg=#f23d70,fg=#090807,bold] on #[bg=#090807]  ,}#[bg=#1e1b18,fg=#f23d70] Windows #[bg=#f23d70,fg=#090807,bold] #{session_windows} #[bg=#090807]  #[bg=#1e1b18,fg=#f23d70] Panes #[bg=#f23d70,fg=#090807,bold] #{window_panes} #[bg=#090807]  #[bg=#1e1b18,fg=#f23d70] Clients #[bg=#f23d70,fg=#090807,bold] #{session_attached} #[bg=#090807]  #[bg=#1e1b18,fg=#f23d70] Dir #[bg=#f23d70,fg=#090807,bold] #{=16:#{b:pane_current_path}} #[bg=#090807] '
setw -g window-status-separator '  '
setw -g window-status-format '#[bg=#141210,fg=#a66a7b] #I #[bg=#a66a7b,fg=#090807] #{=14:#{?#{==:#{window_name},zsh},Shell,#{?#{==:#{window_name},ready},Ready,#{window_name}}}} #[bg=#090807]'
setw -g window-status-current-format '#[bg=#1e1b18,fg=#f23d70,bold] #I #[bg=#f23d70,fg=#090807,bold] #{=14:#{?#{==:#{window_name},zsh},Shell,#{?#{==:#{window_name},ready},Ready,#{window_name}}}} #[bg=#090807]'
setw -g window-status-activity-style 'fg=#f23d70,bg=#090807'
setw -g window-status-bell-style 'fg=#f23d70,bg=#090807,bold'
set -g message-style 'fg=#e8e2da,bg=#141210'
set -g message-command-style 'fg=#f23d70,bg=#141210'
set -g pane-border-style 'fg=#39342f'
set -g pane-active-border-style 'fg=#f23d70'
setw -g mode-style 'bg=#f23d70,fg=#090807'
set -g display-panes-colour '#a9a29a'
set -g display-panes-active-colour '#f23d70'
set -g clock-mode-colour '#f23d70'

# One quiet spacer row above the native clickable status segments.
set -g status 2
set -g status-format[1] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
set -g status-format[0] "#[bg=#090807,norange] "
