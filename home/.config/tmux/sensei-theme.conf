# Sensei: one continuous instrument rail, with colour carrying the hierarchy.
set -g status-style 'bg=#121820,fg=#8bb9f6'
set -g status-position bottom
set -g status-justify left
set -g status-interval 10
set -g status-left-length 62
set -g status-right-length 34
set -g status-left '#[bg=#D8054A,fg=#000000,bold] 󰚩 SENSEI  #[bg=#1b2d45,fg=#8bb9f6,nobold] 󰒋 #{=12:session_name} #[bg=#121820,fg=#44556e] │ #{?client_prefix,#[fg=#D8054A]󰌌 PREFIX ,}#{?pane_in_mode,#[fg=#D8054A]󰆏 COPY ,}#{?window_zoomed_flag,#[fg=#D8054A]󰊓 ZOOM ,}#{?pane_synchronized,#[fg=#ff5b86]󰓦 SYNC ,}'
set -g status-right '#[bg=#1b2d45,fg=#8bb9f6] 󰉋 #{=22:#{b:pane_current_path}} #[bg=#D8054A,fg=#000000,bold] 󰌌 ` '
setw -g window-status-separator '#[bg=#121820,fg=#44556e,nobold] │ '
setw -g window-status-format '#[bg=#18202c,fg=#717d90,nobold]   #I · #{=14:window_name}  '
setw -g window-status-current-format '#[bg=#3b1220,fg=#ff5b86,bold]   #I · #{=14:window_name}  '
setw -g window-status-activity-style 'fg=#ff1767,bg=#141820'
setw -g window-status-bell-style 'fg=#ff1767,bg=#141820,bold'
set -g message-style 'fg=#8bb9f6,bg=#0b0c10'
set -g message-command-style 'fg=#D8054A,bg=#0b0c10'
set -g pane-border-style 'fg=#323843'
set -g pane-active-border-style 'fg=#D8054A'
setw -g mode-style 'bg=#D8054A,fg=#000000'
set -g display-panes-colour '#8bb9f6'
set -g display-panes-active-colour '#ff1767'
set -g clock-mode-colour '#D8054A'
