# Signal Ledger / concise session instrument rail.
set -g status-style 'bg=#090807,fg=#e8e2da'
set -g status-position bottom
set -g status-justify left
set -g status-interval 10
set -g status-left-length 58
set -g status-right-length 110
set -g status-left '#[bg=#090807,fg=#f23d70,bold] ◈ #[fg=#e8e2da,nobold]#{=18:session_name} #[fg=#a9a29a]· #{host_short}   '
set -g status-right '#{?pane_in_mode,#[fg=#f23d70]COPY  ,}#{?window_zoomed_flag,#[fg=#f23d70]ZOOM  ,}#[fg=#a9a29a]#{session_windows}w · #{window_panes}p · #{session_attached}c  #[fg=#e8e2da]#{=18:#{b:pane_current_path}} '
setw -g window-status-separator '  '
setw -g window-status-format '#[bg=#090807,fg=#a9a29a,nobold,nounderscore] #I #{=14:#{?#{==:#{window_name},zsh},Shell,#{?#{==:#{window_name},ready},Ready,#{window_name}}}} #{?window_activity_flag,#[fg=#f23d70]•,}'
setw -g window-status-current-format '#[bg=#21161b,fg=#f23d70,bold,nounderscore] #I #[fg=#e8e2da]#{=14:#{?#{==:#{window_name},zsh},Shell,#{?#{==:#{window_name},ready},Ready,#{window_name}}}} #[bg=#090807,nobold]'
setw -g window-status-activity-style 'fg=#f23d70,bg=#090807'
setw -g window-status-bell-style 'fg=#f23d70,bg=#090807,bold'
set -g message-style 'fg=#e8e2da,bg=#141210'
set -g message-command-style 'fg=#f23d70,bg=#141210'
set -g pane-border-style 'fg=#39342f'
set -g pane-active-border-style 'fg=#f23d70'
setw -g mode-style 'bg=#f23d70,fg=#090807'
set -g display-panes-colour '#a9a29a'
set -g display-panes-active-colour '#f23d70'
set -g clock-mode-colour '#f23d70'
