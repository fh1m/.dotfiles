# Sensei · YASB status bar. Styled by styles.css in this folder.
# GlazeWM starts YASB (startup_commands in ~/.glzr/glazewm/config.yaml), so no separate autostart is needed.
watch_stylesheet: true
watch_config: true
update_check: false
system_colors: false

bars:
  sensei-bar:
    enabled: true
    screens: ['*']
    class_name: 'sensei-bar'
    alignment:
      position: 'top'
      align: 'center'
    dimensions:
      width: '100%'
      height: 32
    padding:
      top: 4
      left: 8
      bottom: 0
      right: 8
    window_flags:
      always_on_top: false
      windows_app_bar: true
    widgets:
      left: ['glazewm_workspaces', 'glazewm_tiling_direction', 'glazewm_binding_mode']
      center: ['clock']
      right: ['cpu', 'memory', 'gpu', 'power_plan', 'volume', 'systray']

widgets:
  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "glazewm offline"
      hide_if_offline: false
      monitor_exclusive: true
      enable_scroll_switching: true
      app_icons:
        enabled_populated: false
        enabled_active: false

  glazewm_tiling_direction:
    type: "glazewm.tiling_direction.GlazewmTilingDirectionWidget"
    options:
      horizontal_label: "󰓡"
      vertical_label: "󰓢"

  glazewm_binding_mode:
    type: "glazewm.binding_mode.GlazewmBindingModeWidget"
    options:
      hide_if_no_active: true
      label_if_no_active: "No binding mode active"
      default_icon: ""
      icons:
        none: ""
        resize: ""
        pause: ""

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%a %d %b  %H:%M}"
      label_alt: "{%A %d %B %Y  %H:%M:%S}"
      timezones: []

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "cpu {info[percent][total]}%"
      update_interval: 2000

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "ram {virtual_mem_percent}%"
      update_interval: 2000

  gpu:
    type: "yasb.gpu.GpuWidget"
    options:
      label: "gpu {info[utilization]}%"

  power_plan:
    type: "yasb.power_plan.PowerPlanWidget"

  volume:
    type: "yasb.volume.VolumeWidget"

  systray:
    type: "yasb.systray.SystrayWidget"
