# Sensei: one calm OLED rail. Wallpaper colour marks only active work.
set -g status-style 'bg=#000000,fg=#edf3fb'
set -g status-position bottom
set -g status-justify left
set -g status-interval 10
set -g status-left-length 56
set -g status-right-length 44
set -g status-left '#[bg=#ff4297,fg=#000000,bold] 󰚩 SENSEI #[bg=#17171a,fg=#edf3fb] 󰒋 #{=18:session_name} #[bg=#000000,fg=#424957,nobold]│'
set -g status-right '#[bg=#17171a,fg=#edf3fb] 󰉋 #{=21:#{b:pane_current_path}} #[bg=#000000,fg=#424957]│#{?client_prefix,#[fg=#ff4297]󰌌 Prefix,}#{?pane_in_mode,#[fg=#ff4297]󰆏 Copy,}#{?window_zoomed_flag,#[fg=#ff4297]󰊓 Zoom,}#[bg=#ff4297,fg=#000000,bold] 󰌌 ` '
setw -g window-status-separator '#[bg=#000000,fg=#424957]│'
setw -g window-status-format '#[bg=#000000,fg=#a9b5c5,nobold]  #I · #{=16:window_name} '
setw -g window-status-current-format '#[bg=#ff4297,fg=#000000,bold]  #I · #{=16:window_name} #[bg=#000000]'
setw -g window-status-activity-style 'fg=#ff4297,bg=#000000'
setw -g window-status-bell-style 'fg=#ff4297,bg=#000000,bold'
set -g message-style 'fg=#edf3fb,bg=#17171a'
set -g message-command-style 'fg=#ff4297,bg=#17171a'
set -g pane-border-style 'fg=#424957'
set -g pane-active-border-style 'fg=#ff4297'
setw -g mode-style 'bg=#ff4297,fg=#000000'
set -g display-panes-colour '#a9b5c5'
set -g display-panes-active-colour '#ff4297'
set -g clock-mode-colour '#ff4297'
