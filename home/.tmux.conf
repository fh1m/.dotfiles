# Bindings
unbind C-b
bind-key | split-window -h
bind-key - split-window -v
bind-key Enter new-window
bind-key "'" new-window
bind -n S-Left  previous-window
bind -n S-Right next-window
bind BSpace kill-pane
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind u run tmux-url-select
bind-key X kill-session
bind r source-file ~/.tmux.conf
bind Space resize-pane -Z
bind  ` last-window

# Options
set -g status-style bg='#0B0D10',fg='#C9D1D9'
set -g status on
set-option -ga terminal-overrides ",xterm*:Tc:smcup@:rmcup@"
set-option -ga terminal-overrides ",screen*:Tc:smcup@:rmcup@"
set-option -ga terminal-overrides ",tmux*:Tc:smcup@:rmcup@"
set-option  -ga terminal-overrides  ",xterm-kitty:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g status-justify centre
set-option -g status-interval 1
set-window-option -g xterm-keys on
set-option -g renumber-windows on

# Style

set -g status-left "#[fg=#0B0D10,bg=#FF3B45,bold] 󰇅 #S #[fg=#2A323C,bg=#0B0D10] "
set -g status-right "#[fg=#4FC3C9,bg=#0B0D10] #H #[fg=#7D8894]│ #[fg=#C9D1D9]%Y-%m-%d #[fg=#4FC3C9]%H:%M "

set -g window-status-current-format "#[fg=#0B0D10,bg=#4FC3C9,bold] #I  #W #[fg=#4FC3C9,bg=#0B0D10] "
set -g window-status-format "#[fg=#7D8894,bg=#0B0D10] #I  #W "

# set -g status-left "#[fg=blue]#[fg=#010005]#[bg=#004eff]   #S  #[bg=#000000]#[fg=#004eff]#[bg=#000000]"
# set -g status-right "#[fg=blue]#[fg=#010005]#[bg=#004eff]   #H  #[bg=#000000]#[fg=#004eff]#[bg=#000000]"
set -g message-style fg='#E6EDF3',bg='#0F1318'
set -g pane-border-style fg='#2A323C'
set -g pane-active-border-style fg='#FF3B45'
# set -g window-status-current-format "#[fg=blue]#[fg=#010005]#[bg=#004eff]  #W  #[bg=#000000]#[fg=#004eff]#[bg=#000000]"
# set -g window-status-format "#[fg=#0a235f]#[fg=#010005]#[bg=#0a235f]  #W  #[bg=#000000]#[fg=#0a235f]#[bg=#000000]"
set -wg mode-style bg='#E8E03A',fg='#0B0D10'
set -g mouse on
setw -g mode-keys vi
setw -g aggressive-resize on
set -g prefix `
set -g status-position bottom
set -g base-index 1
set -g default-terminal "screen-256color"
set -g history-limit 10000
set -gs escape-time 10
set -g status-left-length 50
set -g set-titles on
set -g set-titles-string "#T"
setw -g allow-rename off
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# List of Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin '27medkamal/tmux-session-wizard'
set -g @plugin 'vndmp4/tmux-fzf-session-switch'
set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'


# Plugin Options
set -g @yank_selection_mouse 'clipboard'
set -g display-time 200
set -g @yank_with_mouse on
set -g @shell_mode 'vi'
set -g @scroll-in-moused-over-pane "on"
set -g @scroll-speed-num-lines-per-scroll "1"
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"
set -g @session-wizard-windows on # default is off
set -g @fzf-goto-session 'l'
set -g @fzf-goto-preview-enabled 'true'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
TMUX_FZF_SWITCH_CURRENT=1

# running Tpm
run '~/.tmux/plugins/tpm/tpm'

# Personal theme loads after plugins so their defaults do not override it.
source-file ~/.config/tmux/sensei-theme.conf
