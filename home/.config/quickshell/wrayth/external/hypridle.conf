# Personal idle policy: manual dim/lock/screens-off; battery-only idle sleep.
general {
    lock_cmd = qs -c wrayth ipc call lock lock
    after_sleep_cmd = systemctl --user stop wrayth-battery-idle.service; asusctl backlight --screenpad-brightness 100; hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Once idle for 10 minutes, watch power until activity resumes.
# This also handles unplugging AC while already idle.
listener {
    timeout = 600
    on-timeout = systemctl --user start wrayth-battery-idle.service
    on-resume = systemctl --user stop wrayth-battery-idle.service
}
