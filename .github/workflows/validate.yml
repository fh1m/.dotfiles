name: Validate portable dotfiles
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  install-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Python scripts
        run: python3 -m py_compile scripts/*.py
      - name: Test backup, generic monitor rendering and idempotence
        run: python3 scripts/test-install.py
      - name: Check shell syntax
        run: bash -n scripts/build-native.sh scripts/build-spotify.sh
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libjson-c-dev libssl-dev \
            restic librsvg2-bin ffmpeg python3-venv python3-pil
      - name: Install declared test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tests/requirements.txt
      - name: Run repo tests
        run: .venv/bin/python -m pytest -q tests
      - name: Test native account adapters without provider credentials
        run: bun test tests/codex_account_state.test.ts tests/codex_app_server.test.ts tests/codex_cli_cancellation.test.ts tests/codex_cli_discovery.test.ts tests/codex_cli_profile.test.ts tests/codex_cli_provider.test.ts
