# Signal Ledger / concise session instrument rail.
set -g status-style 'bg=@GROUND@,fg=@TEXT@'
set -g status-position bottom
set -g status-justify left
set -g status-interval 10
set -g status-left-length 58
set -g status-right-length 110
set -g status-left '#[bg=#1e1b18,fg=@ACCENT@,bold,nounderscore] Session #[bg=@ACCENT@,fg=@GROUND@,bold,nounderscore] #{=20:session_name} #[bg=@GROUND@]   '
set -g status-right '#{?pane_in_mode,#[bg=#1e1b18,fg=@ACCENT@] Copy #[bg=@ACCENT@,fg=@GROUND@,bold,nounderscore] mode #[bg=@GROUND@]  ,}#{?window_zoomed_flag,#[bg=#1e1b18,fg=@ACCENT@] Zoom #[bg=@ACCENT@,fg=@GROUND@,bold,nounderscore] on #[bg=@GROUND@]  ,}#[bg=#1e1b18,fg=@ACCENT@] Windows #[bg=@ACCENT@,fg=@GROUND@,bold,nounderscore] #{session_windows} #[bg=@GROUND@]  #[bg=#1e1b18,fg=@ACCENT@] Panes #[bg=@ACCENT@,fg=@GROUND@,bold,nounderscore] #{window_panes} #[bg=@GROUND@]  #[bg=#1e1b18,fg=@ACCENT@] Clients #[bg=@ACCENT@,fg=@GROUND@,bold,nounderscore] #{session_attached} #[bg=@GROUND@]  #[bg=#1e1b18,fg=@ACCENT@] Dir #[bg=@ACCENT@,fg=@GROUND@,bold,nounderscore] #{=16:#{b:pane_current_path}} #[bg=@GROUND@] '
setw -g window-status-separator '  '
setw -g window-status-format '#[bg=#141210,fg=#a66a7b] #I #[bg=#a66a7b,fg=@GROUND@] #{=14:#{?#{==:#{window_name},zsh},Shell,#{?#{==:#{window_name},ready},Ready,#{window_name}}}} #[bg=@GROUND@]'
setw -g window-status-current-format '#[bg=#1e1b18,fg=@ACCENT@,bold,nounderscore] #I #[bg=@ACCENT@,fg=@GROUND@,bold,nounderscore] #{=14:#{?#{==:#{window_name},zsh},Shell,#{?#{==:#{window_name},ready},Ready,#{window_name}}}} #[bg=@GROUND@]'
setw -g window-status-activity-style 'fg=@ACCENT@,bg=@GROUND@'
setw -g window-status-bell-style 'fg=@ACCENT@,bg=@GROUND@,bold'
set -g message-style 'fg=@TEXT@,bg=#141210'
set -g message-command-style 'fg=@ACCENT@,bg=#141210'
set -g pane-border-style 'fg=@OUTLINE@'
set -g pane-active-border-style 'fg=@ACCENT@'
setw -g mode-style 'bg=@ACCENT@,fg=@GROUND@'
set -g display-panes-colour '@MUTED@'
set -g display-panes-active-colour '@ACCENT@'
set -g clock-mode-colour '@ACCENT@'
