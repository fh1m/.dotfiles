"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = 'sensei'
scan_timeout = 20
command_timeout = 500
format = """[](rose)[󰆍 SENSEI](bg:rose fg:ground bold)[](fg:rose) $directory$git_branch$git_status$python${env_var.ROS_DISTRO}$container$line_break$character"""
right_format = '$status$cmd_duration'
[palettes.sensei]
rose = '#fb4670'
ground = '#09090c'
text = '#edf0f7'
muted = '#a9b0bd'
error = '#ff626f'
[directory]
style = 'bold text'
truncation_length = 3
truncate_to_repo = false
format = '[$path]($style)[$read_only]($read_only_style) '
[git_branch]
symbol = ' '
style = 'rose'
format = '[$symbol$branch]($style) '
[git_status]
style = 'rose'
format = '([$all_status$ahead_behind]($style) )'
untracked = '?'
[python]
symbol = ' '
style = 'muted'
format = '[${symbol}${version}( · $virtualenv)]($style) '
[env_var.ROS_DISTRO]
style = 'rose'
format = '[ROS $env_value]($style) '
[container]
style = 'muted'
format = '[ $name]($style) '
[character]
success_symbol = '[❯](bold rose)'
error_symbol = '[❯](bold error)'
[status]
disabled = false
symbol = '✗ '
format = '[$symbol$status]($style) '
style = 'error'
[cmd_duration]
min_time = 1000
format = '[󱎫 $duration](muted)'
